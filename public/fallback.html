<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBR World Cup Predictions - Coming Soon</title>
    <!-- Auto-refresh every 5 seconds to catch when the server is back online -->
    <meta http-equiv="refresh" content="5">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a2c;
            --accent-color: #00ff87; /* Vibrant pitch green */
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Subtle background glow effects */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 135, 0.05) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background-color: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        .logo-area {
            margin-bottom: 2rem;
        }

        /* Animated football/globe icon placeholder */
        .icon-animation {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border: 4px dashed var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 8s linear infinite;
        }

        .icon-inner {
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 20px var(--accent-color);
            animation: pulse 2s ease-in-out infinite;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .brand-name {
            color: var(--text-main);
            font-weight: 800;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Progress Bar */
        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 10px;
            margin: 2rem 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            border-radius: 10px;
            position: absolute;
            animation: loading 2.5s infinite ease-in-out;
        }

        p.footer-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes loading {
            0% { left: -40%; width: 30%; }
            50% { width: 40%; }
            100% { left: 110%; width: 30%; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="logo-area">
            <div class="icon-animation">
                <div class="icon-inner"></div>
            </div>
        </div>

        <h1><span class="brand-name">NBR</span> World Cup Predictions</h1>
        <h2>Please wait!<br>Things are about to get better!</h2>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <p class="footer-text">We are tuning the algorithms for the ultimate tournament experience.</p>
    </div>

</body>
</html>
